name: Build & Release

on:
  push:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for tag history

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew shadowJar

      # ── Determine version + tag ──────────────────────────────────────────────

      - name: Read version from gradle.properties
        id: version
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          BRANCH=${GITHUB_REF_NAME}
          if [ "$BRANCH" = "dev" ]; then
            FULL_VERSION="${VERSION}-dev+$(git rev-parse --short HEAD)"
            TAG="dev-latest"
          else
            FULL_VERSION="${VERSION}"
            TAG="v${VERSION}"
          fi
          echo "version=${FULL_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}"             >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}"       >> $GITHUB_OUTPUT
          echo "is_dev=$( [ '$BRANCH' = 'dev' ] && echo 'true' || echo 'false' )" >> $GITHUB_OUTPUT

      # ── Find the built JAR ───────────────────────────────────────────────────

      - name: Locate JAR
        id: jar
        run: |
          JAR=$(find build/libs -name "*-all.jar" | head -n 1)
          echo "path=${JAR}" >> $GITHUB_OUTPUT
          echo "name=$(basename $JAR)" >> $GITHUB_OUTPUT

      # ── Delete old dev-latest tag/release (rolling dev release) ─────────────

      - name: Delete existing dev-latest release
        if: steps.version.outputs.branch == 'dev'
        run: |
          gh release delete dev-latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Create GitHub Release ────────────────────────────────────────────────

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ steps.version.outputs.tag }}
          name:       ${{ steps.version.outputs.branch == 'dev' && format('Dev Build {0}', steps.version.outputs.version) || format('Release {0}', steps.version.outputs.version) }}
          body:       ${{ steps.version.outputs.branch == 'dev' && '> ⚠️ This is an automated development build. May be unstable.' || '## Release' }}
          prerelease: ${{ steps.version.outputs.is_dev }}
          files:      ${{ steps.jar.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
